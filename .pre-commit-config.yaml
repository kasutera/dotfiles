repos:
  # 基本的なファイル整合性チェック
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending

  # ShellCheck - シェルスクリプト解析
  - repo: https://github.com/ryanrhee/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: \.(sh|bash|zsh)$
        exclude: \.p10k\.zsh$

  # shfmt - シェルスクリプト整形
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [--write, --indent, "4"]
        exclude: \.(p10k\.zsh|zshrc)$

  # Luacheck - Lua 静的解析
  - repo: local
    hooks:
      - id: luacheck
        name: Luacheck
        entry: luacheck --config .luacheckrc
        language: system
        types: [lua]
